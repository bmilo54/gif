{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GIF Generator{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}?v=3">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'projects:project_upload' %}">
            <span class="brand-mark">GIF</span> Generator
        </a>
        <nav class="topnav">
            <a href="{% url 'projects:project_upload' %}">Home</a>
            <a href="{% url 'admin:index' %}">Admin</a>
        </nav>
    </header>

    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="flash flash-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <div class="dialog-backdrop" id="app-dialog" hidden>
        <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="app-dialog-title" aria-describedby="app-dialog-message">
            <h2 id="app-dialog-title">Cannot continue</h2>
            <p id="app-dialog-message"></p>
            <button type="button" class="btn" id="app-dialog-ok">OK</button>
        </div>
    </div>
    <script src="{% static 'js/dialog.js' %}?v=3"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
